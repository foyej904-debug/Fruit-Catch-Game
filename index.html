<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Zone — টেলিগ্রাম মিনি অ্যাপ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(165deg,#141e30 0%,#243b55 100%); min-height:100vh; color:#fff; padding:26px 18px 30px; user-select:none; }
  header { text-align:center; margin-bottom:8px; }
  header .logo { font-size:52px; }
  header h1 { font-size:27px; margin:4px 0; }
  header p { color:#a9bfd6; font-size:14.5px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:440px; margin:22px auto 0; }
  a.game { text-decoration:none; color:#fff; border-radius:22px; padding:22px 14px 18px; text-align:center; display:block; box-shadow:0 10px 24px rgba(0,0,0,.35); transition:transform .12s; }
  a.game:active { transform:scale(.96); }
  a.game .emo { font-size:46px; display:block; margin-bottom:8px; }
  a.game .name { font-size:17px; font-weight:800; display:block; }
  a.game .desc { font-size:12.5px; opacity:.88; display:block; margin-top:4px; line-height:1.45; }
  .g1 { background:linear-gradient(150deg,#ffb347,#ff8c42); }
  .g2 { background:linear-gradient(150deg,#ff7eb3,#ff5e8a); }
  .g3 { background:linear-gradient(150deg,#845ef7,#5f3dc4); }
  .g4 { background:linear-gradient(150deg,#51cf66,#2b8a3e); }
  footer { text-align:center; color:#7d94ad; font-size:12.5px; margin-top:26px; }
</style>
</head>
<body>
<header>
  <div class="logo">🎮</div>
  <h1>Game Zone</h1>
  <p>পছন্দের গেমে চাপ দাও, খেলা শুরু!</p>
</header>
<div class="grid">
  <a class="game g1" href="fruit-catch/index.html">
    <span class="emo">🥭</span>
    <span class="name">Fruit Catch</span>
    <span class="desc">ঝুড়ি দিয়ে ফল ধরো, বোমা এড়াও</span>
  </a>
  <a class="game g2" href="balloon-pop/index.html">
    <span class="emo">🎈</span>
    <span class="name">Balloon Pop</span>
    <span class="desc">বেলুন ফাটাও, বোমা বেলুনে সাবধান</span>
  </a>
  <a class="game g3" href="memory-match/index.html">
    <span class="emo">🧠</span>
    <span class="name">Memory Match</span>
    <span class="desc">কার্ড উল্টে জোড়া মেলাও</span>
  </a>
  <a class="game g4" href="snake/index.html">
    <span class="emo">🐍</span>
    <span class="name">Snake</span>
    <span class="desc">আপেল খাও, লম্বা হও</span>
  </a>
</div>
<footer>নতুন গেম শীঘ্রই আসছে… 🚀</footer>
<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
document.querySelectorAll('a.game').forEach(a => a.addEventListener('click', () => {
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch(e){}
}));
</script>
</body>
</html>
