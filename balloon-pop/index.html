<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Balloon Pop — টেলিগ্রাম মিনি অ্যাপ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(180deg,#8ed6ff 0%,#c8ecff 55%,#fef9e7 100%); user-select:none; touch-action:none; }
  .home { position:fixed; top:10px; left:10px; z-index:60; background:rgba(0,0,0,.35); color:#fff; text-decoration:none; padding:6px 12px; border-radius:999px; font-size:14px; font-weight:600; }
  .hud { position:fixed; top:10px; left:0; right:0; display:flex; justify-content:center; gap:10px; z-index:40; pointer-events:none; }
  .box { background:rgba(255,255,255,.85); border-radius:999px; padding:6px 14px; font-weight:700; font-size:16px; color:#234; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  #sky { position:fixed; inset:0; overflow:hidden; }
  .balloon { position:absolute; bottom:-90px; font-size:56px; cursor:pointer; transition:transform linear; will-change:transform; filter:drop-shadow(0 4px 6px rgba(0,0,0,.2)); }
  .balloon.pop { animation:pop .18s forwards; }
  @keyframes pop { to { transform:scale(1.7); opacity:0; } }
  .plus { position:absolute; font-weight:800; font-size:20px; color:#ff8c42; animation:rise .7s forwards; pointer-events:none; text-shadow:0 1px 3px #fff; }
  @keyframes rise { to { transform:translateY(-46px); opacity:0; } }
  .overlay { position:fixed; inset:0; background:rgba(20,30,45,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .card { background:#fff; border-radius:24px; padding:28px 24px; text-align:center; max-width:340px; width:100%; box-shadow:0 18px 40px rgba(0,0,0,.3); }
  .card h1 { font-size:28px; margin-bottom:8px; color:#1d3557; }
  .card p { color:#5a7186; font-size:15px; line-height:1.55; margin-bottom:18px; }
  .btn { display:block; width:100%; border:none; border-radius:999px; padding:14px; font-size:17px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#ff7eb3,#ff5e8a); color:#fff; box-shadow:0 6px 16px rgba(255,94,138,.4); }
  .best { margin-top:10px; font-size:13px; color:#8aa0b4; }
  .final { font-size:40px; font-weight:800; color:#1d3557; margin:6px 0 2px; }
</style>
</head>
<body>
<a class="home" href="../index.html">🏠 সব গেম</a>
<div class="hud">
  <div class="box">⭐ <span id="score">0</span></div>
  <div class="box">⏱️ <span id="time">60</span></div>
  <div class="box"><span id="lives">❤️❤️❤️</span></div>
</div>
<div id="sky"></div>

<div class="overlay" id="startScreen">
  <div class="card">
    <h1>🎈 Balloon Pop</h1>
    <p>বেলুনে ট্যাপ করে ফাটাও! সাধারণ বেলুন +১, সোনালি ⭐ বেলুন +৫।<br>💣 বোমা বেলুনে ট্যাপ করলেই একটা লাইফ যাবে — সাবধান!</p>
    <button class="btn" id="startBtn">▶️ খেলা শুরু</button>
    <div class="best">সেরা স্কোর: <span id="bestStart">0</span></div>
  </div>
</div>

<div class="overlay" id="endScreen" style="display:none">
  <div class="card">
    <h1>⏰ সময় শেষ!</h1>
    <div class="final"><span id="finalScore">0</span></div>
    <p id="endMsg">দারুণ খেলেছ!</p>
    <button class="btn" id="againBtn">🔄 আবার খেলো</button>
    <div class="best">সেরা স্কোর: <span id="bestEnd">0</span></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch(e){} };

const sky = document.getElementById('sky');
const scoreEl = document.getElementById('score'), timeEl = document.getElementById('time'), livesEl = document.getElementById('lives');
let score = 0, lives = 3, timeLeft = 60, playing = false, spawnTimer = null, tickTimer = null;

const best = () => +(localStorage.getItem('balloon_best') || 0);
document.getElementById('bestStart').textContent = best();

function spawnBalloon() {
  if (!playing) return;
  const b = document.createElement('div');
  b.className = 'balloon';
  const r = Math.random();
  let pts = 1;
  if (r < 0.08) { b.textContent = '💣'; pts = -1; }
  else if (r < 0.2) { b.textContent = '⭐'; pts = 5; b.style.fontSize = '48px'; }
  else { b.textContent = '🎈'; }
  const x = 4 + Math.random() * 86;
  b.style.left = x + 'vw';
  sky.appendChild(b);
  const dur = 2600 + Math.random() * 1900;
  requestAnimationFrame(() => { b.style.transitionDuration = dur + 'ms'; b.style.transform = 'translateY(-115vh)'; });
  const killer = setTimeout(() => { b.remove(); }, dur + 100);
  b.addEventListener('pointerdown', e => {
    if (!playing || b.classList.contains('pop')) return;
    clearTimeout(killer);
    b.classList.add('pop');
    setTimeout(() => b.remove(), 180);
    if (pts === -1) {
      lives--; haptic('heavy');
      livesEl.textContent = '❤️'.repeat(Math.max(lives, 0)) || '💔';
      if (lives <= 0) return endGame();
    } else {
      score += pts; haptic('light');
      const p = document.createElement('div');
      p.className = 'plus'; p.textContent = '+' + pts;
      p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
      document.body.appendChild(p); setTimeout(() => p.remove(), 700);
    }
    scoreEl.textContent = score;
  }, { passive: true });
}

function startGame() {
  score = 0; lives = 3; timeLeft = 60; playing = true;
  scoreEl.textContent = '0'; timeEl.textContent = '60'; livesEl.textContent = '❤️❤️❤️';
  sky.innerHTML = '';
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'none';
  spawnTimer = setInterval(spawnBalloon, 620);
  tickTimer = setInterval(() => {
    timeLeft--; timeEl.textContent = Math.max(timeLeft, 0);
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  if (!playing) return;
  playing = false;
  clearInterval(spawnTimer); clearInterval(tickTimer);
  const isBest = score > best();
  if (isBest) localStorage.setItem('balloon_best', score);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('endMsg').textContent = isBest ? '🏆 নতুন রেকর্ড! অসাধারণ!' : 'দারুণ খেলেছ! আবার চেষ্টা করো।';
  document.getElementById('bestEnd').textContent = best();
  document.getElementById('endScreen').style.display = 'flex';
  haptic('medium');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
</script>
</body>
</html>
