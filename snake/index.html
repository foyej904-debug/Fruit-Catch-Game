<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake — টেলিগ্রাম মিনি অ্যাপ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(160deg,#0f3d2e 0%,#14614a 100%); min-height:100vh; color:#fff; user-select:none; padding:14px; touch-action:manipulation; }
  .home { position:fixed; top:10px; left:10px; z-index:60; background:rgba(255,255,255,.18); color:#fff; text-decoration:none; padding:6px 12px; border-radius:999px; font-size:14px; font-weight:600; }
  h1 { text-align:center; font-size:24px; margin:26px 0 4px; }
  .sub { text-align:center; color:#a7d7c5; font-size:14px; margin-bottom:12px; }
  .hud { display:flex; justify-content:center; gap:10px; margin-bottom:12px; }
  .box { background:rgba(255,255,255,.12); border-radius:999px; padding:6px 16px; font-weight:700; font-size:15px; }
  #wrap { position:relative; width:min(92vw,400px); margin:0 auto; }
  canvas { width:100%; display:block; background:#0b2e22; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); touch-action:none; }
  .overlay { position:absolute; inset:0; background:rgba(5,20,14,.72); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px; text-align:center; }
  .overlay h2 { font-size:24px; }
  .overlay p { color:#cfe8dd; font-size:14px; line-height:1.5; }
  .btn { border:none; border-radius:999px; padding:13px 30px; font-size:16px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,#7ed6a5,#38b27a); color:#fff; }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,56px); gap:8px; justify-content:center; margin-top:16px; }
  .pad button { border:none; border-radius:14px; background:rgba(255,255,255,.16); color:#fff; font-size:24px; cursor:pointer; }
  .pad button:active { background:rgba(255,255,255,.32); }
  .up { grid-column:2; } .left { grid-column:1; grid-row:2; } .down { grid-column:2; grid-row:2; } .right { grid-column:3; grid-row:2; }
  .best { text-align:center; margin-top:10px; font-size:13px; color:#8fb8a7; }
</style>
</head>
<body>
<a class="home" href="../index.html">🏠 সব গেম</a>
<h1>🐍 Snake</h1>
<div class="sub">আপেল খাও, লম্বা হও — দেয়ালে বা নিজের গায়ে লাগলেই শেষ!</div>
<div class="hud">
  <div class="box">⭐ স্কোর: <span id="score">0</span></div>
  <div class="box">🍎 <span id="apples">0</span></div>
</div>
<div id="wrap">
  <canvas id="cv" width="340" height="340"></canvas>
  <div class="overlay" id="ov">
    <h2 id="ovTitle">🐍 Snake</h2>
    <p id="ovText">সোয়াইপ করো বা নিচের বাটন চাপো।<br>আপেল খেলে +১০ পয়েন্ট!</p>
    <button class="btn" id="startBtn">▶️ খেলা শুরু</button>
  </div>
</div>
<div class="pad">
  <button class="up" data-dir="up">⬆️</button>
  <button class="left" data-dir="left">⬅️</button>
  <button class="down" data-dir="down">⬇️</button>
  <button class="right" data-dir="right">➡️</button>
</div>
<div class="best">সেরা স্কোর: <span id="best">0</span></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch(e){} };

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const N = 17, CELL = cv.width / N;
let snake, dir, nextDir, food, score, apples, loop = null, speed;

const best = () => +(localStorage.getItem('snake_best') || 0);
document.getElementById('best').textContent = best();

function placeFood() {
  while (true) {
    const f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}
function draw() {
  ctx.fillStyle = '#0b2e22'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = 'rgba(255,255,255,.04)';
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i + j) % 2 === 0) ctx.fillRect(i * CELL, j * CELL, CELL, CELL);
  ctx.font = (CELL - 2) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🍎', food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7ed957' : '#38b27a';
    const r = i === 0 ? 6 : 5;
    ctx.beginPath();
    ctx.roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, r);
    ctx.fill();
    if (i === 0) { ctx.fillStyle = '#0b2e22'; ctx.font = '11px serif'; ctx.fillText('👀', s.x * CELL + CELL / 2, s.y * CELL + CELL / 2); }
  });
}
function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10; apples++;
    document.getElementById('score').textContent = score;
    document.getElementById('apples').textContent = apples;
    haptic('light');
    placeFood();
    if (apples % 5 === 0 && speed > 70) { speed -= 12; clearInterval(loop); loop = setInterval(step, speed); }
  } else snake.pop();
  draw();
}
function startGame() {
  snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
  dir = { x: 1, y: 0 }; nextDir = dir;
  score = 0; apples = 0; speed = 150;
  document.getElementById('score').textContent = '0';
  document.getElementById('apples').textContent = '0';
  document.getElementById('ov').style.display = 'none';
  placeFood(); draw();
  clearInterval(loop); loop = setInterval(step, speed);
}
function gameOver() {
  clearInterval(loop); loop = null; haptic('heavy');
  const isBest = score > best();
  if (isBest) { localStorage.setItem('snake_best', score); document.getElementById('best').textContent = score; }
  document.getElementById('ovTitle').textContent = '💥 খেলা শেষ!';
  document.getElementById('ovText').innerHTML = 'তোমার স্কোর: <b>' + score + '</b>' + (isBest ? '<br>🏆 নতুন রেকর্ড!' : '');
  document.getElementById('startBtn').textContent = '🔄 আবার খেলো';
  document.getElementById('ov').style.display = 'flex';
}
function setDir(name) {
  const d = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[name];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
}
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); setDir(b.dataset.dir); }));
document.getElementById('startBtn').addEventListener('click', startGame);
let tx = 0, ty = 0;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, { passive: false });
draw();
</script>
</body>
</html>
